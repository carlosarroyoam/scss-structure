<a class="skip-link" href="#main-content">Saltar al contenido</a>

<header class="app-header">
  <div class="app-header__content container">
    <strong>SCSS Architecture</strong>

    <div class="app-header__controls">
      <nav class="app-nav" aria-label="Principal">
        <a
          class="app-nav__link"
          routerLink="/"
          routerLinkActive
          [routerLinkActiveOptions]="{ exact: true }"
          [ariaCurrentWhenActive]="'page'"
        >
          Inicio
        </a>
        <a
          class="app-nav__link"
          routerLink="/estilos"
          routerLinkActive
          [ariaCurrentWhenActive]="'page'"
        >
          Guía de estilos
        </a>
      </nav>

      <div class="theme-selector" role="group" aria-label="Tema visual">
        @for (option of themeOptions; track option.value) {
          <button
            class="theme-selector__button"
            type="button"
            [attr.aria-pressed]="themePreference() === option.value"
            (click)="setTheme(option.value)"
          >
            {{ option.label }}
          </button>
        }
      </div>
    </div>
  </div>
</header>

<main id="main-content" class="app-main container" tabindex="-1">
  <router-outlet />
</main>
