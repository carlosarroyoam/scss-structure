<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>SCSS Structure</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <script>
      try {
        const themePreferenceKey = 'scss-structure:theme-preference';
        const theme = JSON.parse(localStorage.getItem(themePreferenceKey) ?? 'null')?.value;
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
